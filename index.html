<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真实旋转地球</title>
<link rel="icon" href="data:,">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: .5px;
    pointer-events: none; user-select: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 20; color: #cfe3ff; background: #000;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 15px;
    transition: opacity .8s ease;
  }
  .city-label, .nba-label {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
    padding: 2px 7px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.35);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none;
    transform: translateY(-14px); transition: opacity .25s ease;
  }
  .city-label { background: rgba(232,133,58,.85); }
  .nba-label  { background: rgba(124,58,237,.88); border-color: rgba(255,255,255,.42); }
  :root{
    --ui-font: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    --glass: rgba(14,20,34,.72);
    --line: rgba(120,170,255,.22);
  }
  /* 实时时钟叠层 */
  #clock {
    position: fixed; left: 16px; top: 14px; z-index: 12; user-select: none;
    font-family: var(--ui-font); color: #dbe8ff;
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 13px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  #clock .big { font-size: 20px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #clock .row { font-size: 11px; color: rgba(219,232,255,.62); margin-top: 2px; letter-spacing: .3px; }
  #clock .sun { color:#ffcf87; }
  /* 控制面板 */
  #panel {
    position: fixed; right: 14px; top: 14px; z-index: 12; width: 208px;
    font-family: var(--ui-font); color: #dbe8ff;
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,.35); overflow: hidden;
  }
  #panel .hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,.04);
  }
  #panel .hd .tog { color: rgba(219,232,255,.6); transition: transform .2s ease; }
  #panel.collapsed .bd { display: none; }
  #panel.collapsed .hd .tog { transform: rotate(-90deg); }
  #panel .bd { padding: 8px 12px 12px; }
  #panel .sec { font-size: 10px; letter-spacing: 1px; color: rgba(219,232,255,.45);
    margin: 10px 0 5px; text-transform: uppercase; }
  #panel label { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    padding: 3px 0; cursor: pointer; }
  #panel label input { accent-color: #4a9eff; width: 14px; height: 14px; }
  #panel .modebtns { display: flex; gap: 6px; margin: 2px 0 4px; }
  #panel .modebtns button {
    flex: 1; font-family: var(--ui-font); font-size: 12px; color: #dbe8ff;
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 4px; cursor: pointer; transition: all .15s;
  }
  #panel .modebtns button.on { background: rgba(74,158,255,.28); border-color: rgba(74,158,255,.6); color:#fff; }
  #panel .slider { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
  #panel .slider input[type=range] { flex: 1; accent-color: #4a9eff; }
  #panel .btnrow { display: flex; gap: 6px; margin-top: 8px; }
  #panel .btnrow button {
    flex: 1; font-family: var(--ui-font); font-size: 12px; color: #dbe8ff;
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 4px; cursor: pointer;
  }
  #panel .btnrow button:hover { background: rgba(255,255,255,.12); }
  /* 城市信息卡 */
  #cityCard {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(16px);
    z-index: 14; width: min(340px, calc(100vw - 32px)); opacity: 0; pointer-events: none;
    font-family: var(--ui-font); color: #eaf1ff;
    background: linear-gradient(180deg, rgba(20,28,48,.92), rgba(12,18,32,.92));
    border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0,0,0,.5); transition: opacity .25s ease, transform .25s ease;
  }
  #cityCard.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #cityCard .close {
    position: absolute; right: 12px; top: 10px; cursor: pointer; font-size: 18px;
    color: rgba(234,241,255,.5); line-height: 1; padding: 4px;
  }
  #cityCard .close:hover { color: #fff; }
  #cityCard .name { font-size: 21px; font-weight: 700; }
  #cityCard .country { font-size: 12px; color: #ffcf87; margin: 2px 0 10px; letter-spacing: .5px; }
  #cityCard .lt { font-size: 13px; color: rgba(234,241,255,.7); }
  #cityCard .lt b { font-size: 26px; font-weight: 700; color:#fff; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #cityCard .meta { font-size: 11.5px; color: rgba(234,241,255,.55); margin-top: 8px; }
  #cityCard .desc { font-size: 12.5px; line-height: 1.55; color: rgba(234,241,255,.82);
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(120,170,255,.18); }
  @media (max-width: 560px){
    #panel { width: 176px; }
    #clock .big { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="loading">正在加载地球贴图…</div>

<!-- 实时时钟叠层 -->
<div id="clock">
  <div class="big" id="clkUTC">--:--:--</div>
  <div class="row" id="clkLocal">本地 --:--</div>
  <div class="row sun" id="clkSun">☀ 正午经线 --</div>
</div>

<!-- 控制面板 -->
<div id="panel">
  <div class="hd" id="panelHd"><span>⚙ 控制面板</span><span class="tog">▾</span></div>
  <div class="bd">
    <div class="sec">运行模式</div>
    <div class="modebtns">
      <button id="modeReal" class="on">实时昼夜</button>
      <button id="modeDemo">演示自转</button>
    </div>
    <div class="slider" id="speedRow" style="display:none">
      <span>自转速度</span>
      <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1">
    </div>
    <div class="sec">图层</div>
    <label><input type="checkbox" id="lyClouds" checked> 云层</label>
    <label><input type="checkbox" id="lyLights" checked> 城市灯光</label>
    <label><input type="checkbox" id="lyAtmo" checked> 大气辉光</label>
    <label><input type="checkbox" id="lyOrbits" checked> 卫星与轨道</label>
    <label><input type="checkbox" id="lyMoon" checked> 月球</label>
    <label><input type="checkbox" id="lyLabels" checked> 城市标注</label>
    <label><input type="checkbox" id="lyNBA"> NBA 球队</label>
    <div class="btnrow">
      <button id="btnPause">⏸ 暂停</button>
      <button id="btnReset">↺ 重置视角</button>
    </div>
  </div>
</div>

<!-- 城市信息卡 -->
<div id="cityCard">
  <div class="close" id="cardClose">✕</div>
  <div class="name" id="cardName">—</div>
  <div class="country" id="cardCountry">—</div>
  <div class="lt" id="cardLt">当地时间　<b id="cardTime">--:--</b></div>
  <div class="meta" id="cardMeta">—</div>
  <div class="desc" id="cardDesc">—</div>
</div>

<div id="info">
  <div style="margin-bottom:6px">拖动旋转 · 滚轮缩放 · 点击城市查看详情</div>
  <div>
    <span style="color:#00e5ff">■</span> 近地卫星&nbsp;
    <span style="color:#8aff5a">■</span> 极地卫星&nbsp;
    <span style="color:#ffa53a">■</span> 同步卫星&nbsp;
    <span style="color:#ff5ce0">■</span> 大椭圆轨道&nbsp;
    <span style="color:#cfcfcf">●</span> 月球
  </div>
</div>

<script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>
// 贴图源：若存在内嵌 Base64(单文件版)则用之；否则从 assets/ 分离加载(服务器/渐进加载)
const SRC = (f) => (typeof TEXDATA !== "undefined" && TEXDATA[f]) ? TEXDATA[f] : ("assets/" + f);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 0.6, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// 城市名标签渲染器（HTML 覆盖层）
const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = "fixed";
labelRenderer.domElement.style.top = "0";
labelRenderer.domElement.style.left = "0";
labelRenderer.domElement.style.pointerEvents = "none";
document.body.appendChild(labelRenderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5;
controls.minDistance = 1.4;
controls.maxDistance = 45;   // 放大范围以容纳月球轨道
controls.enablePan = false;

// ---- 光照：太阳方向 ----
const sunDir = new THREE.Vector3(-1, 0.25, 0.6).normalize();
const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
sunLight.position.copy(sunDir);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223355, 0.15));

const loadMgr = new THREE.LoadingManager();
const loader = new THREE.TextureLoader(loadMgr);
const load = (f) => { const t = loader.load(SRC(f)); t.encoding = THREE.sRGBEncoding; return t; };

// 渐进加载：日面贴图就绪即显示地球，隐藏加载遮罩
let revealed = false;
function revealGlobe(){
  if (revealed) return; revealed = true;
  const el = document.getElementById("loading");
  if (el){ el.style.opacity = 0; setTimeout(()=>el.remove(), 600); }
}

// 关键路径：日面图(仅 ~72KB)先加载 → 秒出地球
const dayMap = loader.load(SRC("earth_atmos_1024.jpg"), revealGlobe);
dayMap.encoding = THREE.sRGBEncoding;
// 其余贴图后台并行加载，就绪后自动补上(three 会在图片载入后刷新材质)
const normalMap = loader.load(SRC("earth_normal_1024.jpg"));
const specMap   = loader.load(SRC("earth_specular_1024.jpg"));
const lightsMap = load("earth_lights_1024.jpg");
const cloudsMap = loader.load(SRC("earth_clouds_1024.png"));
const moonMap   = load("moon_1024.jpg");

const R = 1;

// ---- 地球：自定义 shader 混合昼夜 + 城市灯光 ----
const earthMat = new THREE.MeshStandardMaterial({
  map: dayMap,
  normalMap: normalMap,
  normalScale: new THREE.Vector2(0.85, 0.85),
  roughnessMap: specMap,   // 海洋更光滑
  metalness: 0.0,
  roughness: 1.0,
});
// 注入夜面城市灯光
let earthShader = null;              // 供图层开关调节灯光强度
earthMat.onBeforeCompile = (shader) => {
  earthShader = shader;
  shader.uniforms.uLights = { value: lightsMap };
  shader.uniforms.uSunDir = { value: sunDir };
  shader.uniforms.uLightsOn = { value: 1.0 };
  shader.vertexShader = shader.vertexShader.replace(
    "#include <common>",
    "#include <common>\n varying vec3 vWNormal; varying vec2 vUvL;"
  ).replace(
    "#include <begin_vertex>",
    "#include <begin_vertex>\n vWNormal = normalize(mat3(modelMatrix) * normal); vUvL = uv;"
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <common>",
    "#include <common>\n uniform sampler2D uLights; uniform vec3 uSunDir; uniform float uLightsOn; varying vec3 vWNormal; varying vec2 vUvL;"
  ).replace(
    "#include <dithering_fragment>",
    `#include <dithering_fragment>
     float d = dot(normalize(vWNormal), normalize(uSunDir));
     float night = smoothstep(0.05, -0.25, d);
     vec3 city = texture2D(uLights, vUvL).rgb;
     gl_FragColor.rgb += city * night * 2.2 * uLightsOn;`
  );
};

const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 128), earthMat);
scene.add(earth);

// ---- 云层 ----
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.008, 96, 96),
  new THREE.MeshStandardMaterial({
    map: cloudsMap, alphaMap: cloudsMap, transparent: true,
    opacity: 0.9, depthWrite: false, metalness: 0, roughness: 1,
  })
);
scene.add(clouds);

// ---- 大气辉光（Fresnel 背面球）----
const atmoMat = new THREE.ShaderMaterial({
  transparent: true, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color(0x4a9eff) }, uSunDir: { value: sunDir } },
  vertexShader: `
    varying vec3 vN; varying vec3 vWN;
    void main(){ vN = normalize(normalMatrix * normal);
      vWN = normalize(mat3(modelMatrix)*normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vN; varying vec3 vWN; uniform vec3 uColor; uniform vec3 uSunDir;
    void main(){
      float f = pow(1.0 - abs(vN.z), 2.4);
      float lit = clamp(dot(normalize(vWN), normalize(uSunDir))*0.5+0.6, 0.15, 1.0);
      gl_FragColor = vec4(uColor * f * lit, f); }`
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(R * 1.16, 64, 64), atmoMat);
scene.add(atmosphere);

// ---- 星空背景 ----
(() => {
  const N = 4000, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const r = 90 + Math.random()*60;
    const th = Math.acos(2*Math.random()-1), ph = Math.random()*Math.PI*2;
    pos[i*3]   = r*Math.sin(th)*Math.cos(ph);
    pos[i*3+1] = r*Math.cos(th);
    pos[i*3+2] = r*Math.sin(th)*Math.sin(ph);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.35, sizeAttenuation:true })));
})();

// ================= 卫星与轨道系统 =================
const EARTH_RATE = 0.06;          // 地球自转角速度(rad/s)
const K = 1.137;                  // 开普勒速率常数：rate = K / a^1.5
const deg = THREE.MathUtils.degToRad;

// 开普勒方程求解：由平近点角 M 得偏近点角 E，再得真近点角 ν
function solveKepler(M, e){
  let E = M;
  for (let i=0;i<6;i++) E = E - (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
  return E;
}
function trueAnomaly(E, e){
  return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
}

// 小卫星模型：本体 + 两片太阳能帆板
function makeSat(color, size){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(size, size, size*1.4),
    new THREE.MeshStandardMaterial({ color:0xdedede, emissive:color, emissiveIntensity:0.7, metalness:0.6, roughness:0.4 })
  );
  g.add(body);
  const panelMat = new THREE.MeshStandardMaterial({ color:0x1b3f8b, emissive:0x0a1830, metalness:0.4, roughness:0.5, side:THREE.DoubleSide });
  const p1 = new THREE.Mesh(new THREE.PlaneGeometry(size*3.2, size*1.1), panelMat); p1.position.x =  size*2.4;
  const p2 = p1.clone(); p2.position.x = -size*2.4;
  g.add(p1, p2);
  return g;
}

const orbits = [];
// a=半长轴, e=离心率, incl=倾角, raan=升交点赤经, argp=近地点幅角, phase=初相位, geoSync=是否与地球自转同步
function buildOrbit(o){
  const a=o.a, e=o.e||0;
  // 轨道线（焦点在原点的椭圆）
  const pts=[];
  for(let i=0;i<=360;i++){
    const th = deg(i);
    const r = a*(1-e*e)/(1+e*Math.cos(th));
    pts.push(new THREE.Vector3(r*Math.cos(th), 0, r*Math.sin(th)));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:o.color, transparent:true, opacity:o.dim?0.28:0.5 })
  );
  const sat = o.moon
    ? new THREE.Mesh(new THREE.SphereGeometry(0.27, 48, 48),
        new THREE.MeshStandardMaterial({ map:moonMap, metalness:0, roughness:1 }))
    : makeSat(o.satColor||o.color, o.size||0.03);

  const group = new THREE.Group();
  group.add(line, sat);
  // 轨道定向：先 argp 绕法线(y)，再 incl 绕交点线(x)，最后 raan 绕全局竖轴(y)
  group.quaternion.setFromEuler(new THREE.Euler(0, deg(o.raan||0), 0))
    .multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(deg(o.incl||0), 0, 0)))
    .multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, deg(o.argp||0), 0)));
  scene.add(group);

  const rate = o.geoSync ? EARTH_RATE : K / Math.pow(a, 1.5);
  orbits.push({ sat, a, e, rate, M0: deg(o.phase||0), group, isMoon: !!o.moon });
}

// —— 四类卫星 + 月球 ——
buildOrbit({ a:1.30, e:0,    incl:28,   color:0x00e5ff, phase:0,   size:0.028 });                 // 近地卫星 LEO
buildOrbit({ a:1.55, e:0,    incl:90,   color:0x8aff5a, phase:120, size:0.028 });                 // 极地卫星
buildOrbit({ a:6.60, e:0,    incl:0,    color:0xffa53a, phase:40,  size:0.05, geoSync:true });    // 同步卫星 GEO
buildOrbit({ a:4.20, e:0.62, incl:63.4, argp:270, color:0xff5ce0, phase:0, size:0.045 });         // 大椭圆(闪电型)
buildOrbit({ a:12.0, e:0.045,incl:5.1,  color:0xcfcfcf, phase:200, moon:true, dim:true });        // 月球

// ================= 全球热门旅游城市标注点 =================
// tz = 标准时区(UTC 偏移小时，未计夏令时)；desc 为一句话简介
const CITIES = [
  { name:"巴黎",     lat:48.85, lon:2.35,   country:"法国",       tz:1,    desc:"塞纳河畔的浪漫之都，埃菲尔铁塔与卢浮宫所在地。" },
  { name:"伦敦",     lat:51.51, lon:-0.13,  country:"英国",       tz:0,    desc:"泰晤士河穿城而过，大本钟与塔桥的千年古都。" },
  { name:"罗马",     lat:41.90, lon:12.50,  country:"意大利",     tz:1,    desc:"永恒之城，斗兽场与梵蒂冈见证两千年文明。" },
  { name:"巴塞罗那", lat:41.39, lon:2.17,   country:"西班牙",     tz:1,    desc:"高迪建筑之城，圣家堂与地中海阳光交织。" },
  { name:"伊斯坦布尔",lat:41.01, lon:28.98, country:"土耳其",     tz:3,    desc:"横跨欧亚，博斯普鲁斯海峡连接两大洲。" },
  { name:"迪拜",     lat:25.20, lon:55.27,  country:"阿联酋",     tz:4,    desc:"沙漠中崛起的未来都市，哈利法塔刺破天际。" },
  { name:"纽约",     lat:40.71, lon:-74.01, country:"美国",       tz:-5,   desc:"不夜之城，自由女神与曼哈顿天际线的舞台。" },
  { name:"东京",     lat:35.68, lon:139.69, country:"日本",       tz:9,    desc:"传统与霓虹并存，全球最大都会区之一。" },
  { name:"北京",     lat:39.90, lon:116.40, country:"中国",       tz:8,    desc:"千年古都，故宫与长城见证中华文明。" },
  { name:"曼谷",     lat:13.76, lon:100.50, country:"泰国",       tz:7,    desc:"金色佛塔与街头美食汇聚的东南亚枢纽。" },
  { name:"新加坡",   lat:1.35,  lon:103.82, country:"新加坡",     tz:8,    desc:"赤道上的花园城市国家，金融与美食之都。" },

// 经纬度 → 球面三维坐标（匹配等距圆柱投影地图贴图）
function latLonToVec3(lat, lon, r){
  const phi = deg(90 - lat);
  const theta = deg(lon + 180);
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// 水滴轮廓：针尖(0,0) → 沿切线上行 → 气泡圆弧收顶，绕 Y 轴旋成三维水滴
const pinGeo = (() => {
  const pts = [ new THREE.Vector2(0, 0) ];
  const start = Math.acos(PIN_RB / PIN_CY);   // 切点角(与竖直方向夹角)，保证锥面与气泡平滑相切
  const SEG = 22;
  for (let i = 0; i <= SEG; i++){
    const phi = start + (Math.PI - start) * (i / SEG);
    pts.push(new THREE.Vector2(PIN_RB * Math.sin(phi), PIN_CY - PIN_RB * Math.cos(phi)));
  }
  return new THREE.LatheGeometry(pts, 40);
})();
// 针体垂直渐变：顶部气泡明亮、针尖渐深 → 无需依赖场景光即有立体感，昼夜面都鲜亮
const pinBodyTex = (() => {
  const cv = document.createElement("canvas"); cv.width = 16; cv.height = 128;
  const x = cv.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 128);   // 顶=气泡(v=1)，底=针尖(v=0)
  g.addColorStop(0.00, "#ff8a72");
  g.addColorStop(0.32, "#f4503b");
  g.addColorStop(0.68, "#dc3325");
  g.addColorStop(1.00, "#9e1a11");
  x.fillStyle = g; x.fillRect(0, 0, 16, 128);
  const t = new THREE.CanvasTexture(cv); return t;
})();
const pinMat = new THREE.MeshStandardMaterial({
  map: pinBodyTex,
  emissive: 0xffffff, emissiveMap: pinBodyTex, emissiveIntensity: 0.42,  // 自发光沿用渐变→夜面保形保色
  roughness: 0.3, metalness: 0.0, side: THREE.DoubleSide
});
// NBA 定位标：同款水滴，换成好看的紫罗兰渐变以区别于城市红标
const pinBodyTexNBA = (() => {
  const cv = document.createElement("canvas"); cv.width = 16; cv.height = 128;
  const x = cv.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0.00, "#d9b8ff");
  g.addColorStop(0.32, "#a06bf5");
  g.addColorStop(0.68, "#7c3aed");
  g.addColorStop(1.00, "#4c1d95");
  x.fillStyle = g; x.fillRect(0, 0, 16, 128);
  return new THREE.CanvasTexture(cv);
})();
const pinMatNBA = new THREE.MeshStandardMaterial({
  map: pinBodyTexNBA,
  emissive: 0xffffff, emissiveMap: pinBodyTexNBA, emissiveIntensity: 0.42,
  roughness: 0.3, metalness: 0.0, side: THREE.DoubleSide
});
// 气泡中心白色圆孔（Sprite 始终朝向相机）：带内阴影→凹陷质感
const holeTex = (() => {
  const S = 128, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const x = cv.getContext("2d"), c = S / 2;
  x.beginPath(); x.arc(c, c, 46, 0, Math.PI * 2); x.fillStyle = "#fff"; x.fill();
  const ish = x.createRadialGradient(c, c - 12, 4, c, c, 48);   // 上浅下深→凹孔
  ish.addColorStop(0, "rgba(110,18,10,0)");
  ish.addColorStop(1, "rgba(110,18,10,.4)");
  x.fillStyle = ish; x.beginPath(); x.arc(c, c, 46, 0, Math.PI * 2); x.fill();
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return t;
})();
// 气泡高光：柔和白色圆点(叠加混合)→ 玻璃/糖果光泽
const glossTex = (() => {
  const S = 64, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const x = cv.getContext("2d"), c = S / 2;
  const g = x.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, "rgba(255,255,255,.9)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(cv); return t;
})();
// depthTest:false → 小孔/高光始终画在气泡之上（定位标已在背面隐藏，不会穿透地球）
const holeMat  = new THREE.SpriteMaterial({ map: holeTex,  transparent: true, depthTest: false, depthWrite: false });
const glossMat = new THREE.SpriteMaterial({ map: glossTex, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending });

// 通用标记工厂：城市与 NBA 球队复用同一水滴造型，仅材质/环色/标签样式不同
// data 可含 variants[]（同城多队共用一个标记，标签轮换）；否则视为单一目标
function addMarker(data, i, opts){
  const variants = data.variants || [data];
  const info0 = variants[0];
  const outward = latLonToVec3(data.lat, data.lon, 1.0).normalize();

  // 水滴定位标（针尖朝地心、气泡朝外）
  const pin = new THREE.Mesh(pinGeo, opts.pinMat);
  pin.quaternion.setFromUnitVectors(UP, outward);
  pin.position.copy(outward).multiplyScalar(PIN_BASE);
  markersGroup.add(pin);

  // 气泡白孔（作为 pin 子对象，随其悬浮/隐藏）
  const hole = new THREE.Sprite(holeMat);
  hole.scale.setScalar(0.015);
  hole.position.set(0, PIN_CY, 0);
  pin.add(hole);

  // 气泡高光点（偏上，营造光泽）
  const gloss = new THREE.Sprite(glossMat);
  gloss.scale.setScalar(0.02);
  gloss.position.set(-PIN_RB * 0.35, PIN_CY + PIN_RB * 0.5, PIN_RB * 0.4);
  pin.add(gloss);

  // 落点脉冲光环（贴球面，柔和细环，与定位标呼应）
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.013, 0.019, 40),
    new THREE.MeshBasicMaterial({ color:opts.ringColor, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false })
  );
  ring.position.copy(outward).multiplyScalar(PIN_BASE);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), outward);
  markersGroup.add(ring);

  // HTML 名称标签（浮于气泡上方）
  const el = document.createElement("div");
  el.className = opts.labelClass;
  el.textContent = info0.name;
  const label = new THREE.CSS2DObject(el);
  label.position.copy(outward.clone().multiplyScalar(PIN_BASE + PIN_TOP + 0.03));
  markersGroup.add(label);

  markers.push({ pin, hole, gloss, ring, el, outward, data: info0, variants, vi: 0,
    type: opts.type, ringColor: opts.ringColor, phase: i * 0.7 });
}
CITIES.forEach((c, i) => addMarker(c, i, { pinMat, ringColor:0xff6a58, labelClass:"city-label", type:"city" }));

// NBA：带 group 的同城球队（纽约尼克斯/布鲁克林篮网、洛杉矶湖人/洛杉矶快船）合并为一个标记，标签每 3 秒轮换

// 城市标注：脉冲动画 + 背面自动隐藏 + 缩小时隐藏名称 + 屏幕空间去重叠
// 相机距离 > 该值时视为“看到完整地球”，此时隐藏所有城市名（放大靠近后才显示）
const LABEL_SHOW_DIST = 2.5;
const _wp = new THREE.Vector3(), _toCam = new THREE.Vector3(), _proj = new THREE.Vector3();
let hoverMarker = null;                          // 鼠标悬停的标记（强制显示其名称）
const _placed = [];                              // 本帧已占位的标签矩形（去重叠用）
// 两个屏幕矩形（中心+半宽半高）是否相交（含 pad 间距）
function labelsOverlap(a, b, pad){
  return Math.abs(a.x - b.x) * 2 < a.w + b.w + pad * 2 &&
         Math.abs(a.y - b.y) * 2 < a.h + b.h + pad * 2;
}
function updateCityMarkers(){
  const pulse = 1 + 0.35 * Math.sin(elapsed * 3);
  const zoomedIn = camera.position.distanceTo(controls.target) < LABEL_SHOW_DIST;  // 已放大才显示名称
  const W = innerWidth, H = innerHeight;
  const cand = [];                               // 本帧参与标签竞争的候选

  for (const m of markers){
    // 同城多队共用一个标记：每 3 秒轮换显示的球队（选中查看信息卡时冻结在当前队）
    if (m.variants.length > 1 && m !== selectedMarker){
      const vi = Math.floor(elapsed / 3) % m.variants.length;
      if (vi !== m.vi){ m.vi = vi; m.data = m.variants[vi]; m.el.textContent = m.data.name; m.w = 0; }
    }

    const on = (m.type === "nba") ? layers.nba : layers.labels;   // 各自图层开关
    const sel = m === selectedMarker;
    const hov = m === hoverMarker;

    // 定位标悬浮动效（各标记相位错开，选中/悬停时抬得更高）
    const lift = 0.010 * (0.5 + 0.5 * Math.sin(elapsed * 2.2 + m.phase)) + (sel ? 0.012 : hov ? 0.006 : 0);
    m.pin.position.copy(m.outward).multiplyScalar(PIN_BASE + lift);
    m.pin.scale.setScalar(sel ? 1.4 : hov ? 1.18 : 1.0);

    // 落点光环脉冲（未选中用各自基色，选中统一变蓝高亮）
    m.ring.scale.setScalar(sel ? pulse * 1.6 : pulse);
    m.ring.material.opacity = (sel ? 0.95 : 0.5) - 0.32 * (pulse - 0.65);
    m.ring.material.color.setHex(sel ? 0x4a9eff : m.ringColor);

    m.pin.getWorldPosition(_wp);                 // 世界坐标（地球在原点）
    const normal = _wp.clone().normalize();      // 该点朝外法线
    _toCam.copy(camera.position).sub(_wp);        // 指向相机
    const facing = normal.dot(_toCam.normalize()); // >0 为正面
    m.pin.visible = m.ring.visible = on && facing > -0.05;  // hole 为 pin 子对象随之隐藏
    m._facing = facing;

    // 投影到屏幕像素（标签锚点在定位标上方约 22px）
    _proj.copy(_wp).project(camera);
    m._sx = (_proj.x * 0.5 + 0.5) * W;
    m._sy = (-_proj.y * 0.5 + 0.5) * H;

    // 名称候选：图层开、在正面、已放大（或被选中/悬停时始终参与）
    const eligible = on && facing > 0.12 && (zoomedIn || sel || hov);
    m._show = false;
    if (eligible){
      if (m.w === undefined || m.w === 0) m.w = m.el.offsetWidth || (m.el.textContent.length * 13 + 16);
      cand.push(m);
    } else {
      m.el.style.opacity = 0;                    // 不参与竞争的直接隐藏
    }
  }

  // 优先级：选中/悬停最高，其余按正对程度（越居中越优先）——高优先者先占位，冲突者让位
  cand.sort((a, b) => {
    const ap = (a === selectedMarker || a === hoverMarker) ? 1 : 0;
    const bp = (b === selectedMarker || b === hoverMarker) ? 1 : 0;
    if (ap !== bp) return bp - ap;
    return b._facing - a._facing;
  });
  _placed.length = 0;
  for (const m of cand){
    const forced = (m === selectedMarker || m === hoverMarker);
    const rect = { x: m._sx, y: m._sy - 22, w: m.w, h: 20 };
    let ok = true;
    if (!forced){
      for (const p of _placed){ if (labelsOverlap(rect, p, 5)){ ok = false; break; } }
    }
    if (ok){ m._show = true; _placed.push(rect); }
    m.el.style.opacity = m._show ? 1 : 0;
  }
}

// ================= 运行状态 =================
const layers = { labels: true, nba: false };  // 城市标注 / NBA 图层开关（updateCityMarkers 读取）
let selectedMarker = null;                 // 当前选中的标记（城市或球队）

let spinMul = 1.0;                         // 演示自转速度倍率

// ---- 功能1：按真实时间计算太阳方向（昼夜线与现实一致） ----
// 计算太阳直射点：纬度=赤纬 δ，经度由 UTC 时刻决定
function subsolarPoint(date){
  const yStart = Date.UTC(date.getUTCFullYear(), 0, 0);
  const doy = (Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - yStart) / 86400000;
  const decl = -23.44 * Math.cos(deg(360 / 365 * (doy + 10)));   // 赤纬近似
  const hUTC = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
  let lon = (12 - hUTC) * 15;                                    // 正午所在经线
  while (lon > 180) lon -= 360; while (lon < -180) lon += 360;
  return { lat: decl, lon };
}
const _localSun = new THREE.Vector3();
let subsolarLon = 0;
function updateSun(){
  if (mode === "realtime"){
    const ss = subsolarPoint(new Date());
    subsolarLon = ss.lon;
    // 直射点在“地理坐标系”，乘以地球四元数(含倾角/自转)得到世界方向 → 被照亮的正是真实地理位置
    _localSun.copy(latLonToVec3(ss.lat, ss.lon, 1)).applyQuaternion(earth.quaternion);
    sunDir.copy(_localSun).normalize();          // earthMat/大气 shader 共享同一 sunDir，自动更新
  }
  sunLight.position.copy(sunDir).multiplyScalar(10);
}

// ---- 功能1：时钟叠层 ----
const clkUTC = document.getElementById("clkUTC");
const clkLocal = document.getElementById("clkLocal");
const clkSun = document.getElementById("clkSun");
const pad = (n) => String(n).padStart(2, "0");
function fmtLonLabel(lon){
  const dir = lon >= 0 ? "E" : "W";
  return Math.abs(lon).toFixed(0) + "°" + dir;
}
let lastSec = -1;
function updateClock(){
  const now = new Date();
  const s = now.getUTCSeconds();
  if (s === lastSec) return;                       // 每秒刷新一次
  lastSec = s;
  clkUTC.textContent = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(s)} UTC`;
  clkLocal.textContent = "本地 " + now.toLocaleTimeString("zh-CN", { hour12:false });
  clkSun.textContent = (mode === "realtime")
    ? `☀ 正午经线 ${fmtLonLabel(subsolarLon)}`
    : "▶ 演示自转中";
  if (selectedMarker) refreshCardTime();           // 信息卡当地时间同步走秒
}

// ---- 功能2：点击城市 → 信息卡 ----
const card = document.getElementById("cityCard");
const cardName = document.getElementById("cardName");
const cardCountry = document.getElementById("cardCountry");
const cardTime = document.getElementById("cardTime");
const cardMeta = document.getElementById("cardMeta");
const cardDesc = document.getElementById("cardDesc");
function cityLocalTime(tz){
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;   // → UTC 毫秒
  const d = new Date(utcMs + tz * 3600000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const cardLt = document.getElementById("cardLt");
function refreshCardTime(){
  if (selectedMarker && selectedMarker.type === "city") cardTime.textContent = cityLocalTime(selectedMarker.data.tz);
}
function openCard(m){
  selectedMarker = m;
  const d = m.data;
  cardName.textContent = d.name;
  if (m.type === "nba"){
    // NBA 球队卡：只展示球队介绍句（无当地时间/坐标）
    cardCountry.textContent = "NBA 球队";
    cardLt.style.display = "none";
    cardMeta.style.display = "none";
    const cityM = d.city.endsWith("城") ? d.city : d.city + "市";   // 已以“城”结尾则不再叠“市”
    cardDesc.textContent = `${d.name}球队所在位置是${d.state}${cityM}。`;
  } else {
    cardCountry.textContent = d.country;
    cardLt.style.display = "";
    cardMeta.style.display = "";
    cardTime.textContent = cityLocalTime(d.tz);
    const tzs = (d.tz >= 0 ? "+" : "") + d.tz;
    const latS = Math.abs(d.lat).toFixed(2) + "°" + (d.lat >= 0 ? "N" : "S");
    const lonS = Math.abs(d.lon).toFixed(2) + "°" + (d.lon >= 0 ? "E" : "W");
    cardMeta.textContent = `${latS}, ${lonS}　·　时区 UTC${tzs}`;
    cardDesc.textContent = d.desc;
  }
  card.classList.add("show");
}
function closeCard(){ selectedMarker = null; card.classList.remove("show"); }
document.getElementById("cardClose").addEventListener("click", closeCard);

// 点击(非拖拽)检测：射线击中地球 → 就近匹配城市
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const _localHit = new THREE.Vector3();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
// 悬停某定位标 → 强制显示其名称（即便被去重叠隐藏），并给出手型光标
renderer.domElement.addEventListener("pointermove", (e) => {
  let best = null, bestD = 24 * 24;              // 命中半径 ~24px
  for (const m of markers){
    if (!m.pin.visible) continue;                // 只在可见定位标上悬停
    const dx = e.clientX - m._sx, dy = e.clientY - m._sy;
    const d = dx * dx + dy * dy;
    if (d < bestD){ bestD = d; best = m; }
  }
  hoverMarker = best;
  renderer.domElement.style.cursor = best ? "pointer" : "";
});
renderer.domElement.addEventListener("pointerup", (e) => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 6 || performance.now() - downT > 500) return;       // 视为拖拽/长按
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(earth, false)[0];
  if (!hit){ closeCard(); return; }
  earth.worldToLocal(_localHit.copy(hit.point)).normalize();       // 命中点 → 地球本地朝外法线
  let best = null, bestDot = Math.cos(deg(7));                      // 阈值 ~7°
  for (const m of markers){
    if (!(m.type === "nba" ? layers.nba : layers.labels)) continue; // 只拾取当前显示的图层
    const d = _localHit.dot(m.outward);
    if (d > bestDot){ bestDot = d; best = m; }
  }
  if (best) openCard(best); else closeCard();
});

const clock = new THREE.Clock();
let elapsed = 0;
(function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (!paused){
    elapsed += dt;
    if (mode === "demo") earth.rotation.y += dt * EARTH_RATE * spinMul;  // 实时模式下地球不自转，昼夜线才准
    clouds.rotation.y += dt * 0.08;   // 云层稍快

    // 更新卫星/月球位置（开普勒运动，近地点快、远地点慢）
    for (const ob of orbits){
      const M = ob.M0 + ob.rate * elapsed;
      const E = solveKepler(M, ob.e);
      const nu = trueAnomaly(E, ob.e);
      const r  = ob.a * (1 - ob.e * Math.cos(E));
      ob.sat.position.set(r*Math.cos(nu), 0, r*Math.sin(nu));
    }
  }

  updateSun();
  updateClock();
  updateCityMarkers();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();
</script>
