<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真实旋转地球</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: .5px;
    pointer-events: none; user-select: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 20; color: #cfe3ff; background: #000;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 15px;
    transition: opacity .8s ease;
  }
  .city-label {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
    padding: 2px 7px; border-radius: 10px;
    background: rgba(232,133,58,.85); border: 1px solid rgba(255,255,255,.35);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none;
    transform: translateY(-14px); transition: opacity .25s ease;
  }
</style>
</head>
<body>
<div id="loading">正在加载地球贴图…</div>
<div id="info">
  <div style="margin-bottom:6px">拖动旋转 · 滚轮缩放 · 自动运行</div>
  <div>
    <span style="color:#00e5ff">■</span> 近地卫星&nbsp;
    <span style="color:#8aff5a">■</span> 极地卫星&nbsp;
    <span style="color:#ffa53a">■</span> 同步卫星&nbsp;
    <span style="color:#ff5ce0">■</span> 大椭圆轨道&nbsp;
    <span style="color:#cfcfcf">●</span> 月球
  </div>
</div>

<script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>
// 贴图源：若存在内嵌 Base64(单文件版)则用之；否则从 assets/ 分离加载(服务器/渐进加载)
const SRC = (f) => (typeof TEXDATA !== "undefined" && TEXDATA[f]) ? TEXDATA[f] : ("assets/" + f);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 0.6, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// 城市名标签渲染器（HTML 覆盖层）
const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = "fixed";
labelRenderer.domElement.style.top = "0";
labelRenderer.domElement.style.left = "0";
labelRenderer.domElement.style.pointerEvents = "none";
document.body.appendChild(labelRenderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5;
controls.minDistance = 1.4;
controls.maxDistance = 45;   // 放大范围以容纳月球轨道
controls.enablePan = false;

// ---- 光照：太阳方向 ----
const sunDir = new THREE.Vector3(-1, 0.25, 0.6).normalize();
const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
sunLight.position.copy(sunDir);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223355, 0.15));

const loadMgr = new THREE.LoadingManager();
const loader = new THREE.TextureLoader(loadMgr);
const load = (f) => { const t = loader.load(SRC(f)); t.encoding = THREE.sRGBEncoding; return t; };

// 渐进加载：日面贴图就绪即显示地球，隐藏加载遮罩
let revealed = false;
function revealGlobe(){
  if (revealed) return; revealed = true;
  const el = document.getElementById("loading");
  if (el){ el.style.opacity = 0; setTimeout(()=>el.remove(), 600); }
}

// 关键路径：日面图(仅 ~72KB)先加载 → 秒出地球
const dayMap = loader.load(SRC("earth_atmos_1024.jpg"), revealGlobe);
dayMap.encoding = THREE.sRGBEncoding;
// 其余贴图后台并行加载，就绪后自动补上(three 会在图片载入后刷新材质)
const normalMap = loader.load(SRC("earth_normal_1024.jpg"));
const specMap   = loader.load(SRC("earth_specular_1024.jpg"));
const lightsMap = load("earth_lights_1024.jpg");
const cloudsMap = loader.load(SRC("earth_clouds_1024.png"));
const moonMap   = load("moon_1024.jpg");

const R = 1;

// ---- 地球：自定义 shader 混合昼夜 + 城市灯光 ----
const earthMat = new THREE.MeshStandardMaterial({
  map: dayMap,
  normalMap: normalMap,
  normalScale: new THREE.Vector2(0.85, 0.85),
  roughnessMap: specMap,   // 海洋更光滑
  metalness: 0.0,
  roughness: 1.0,
});
// 注入夜面城市灯光
earthMat.onBeforeCompile = (shader) => {
  shader.uniforms.uLights = { value: lightsMap };
  shader.uniforms.uSunDir = { value: sunDir };
  shader.vertexShader = shader.vertexShader.replace(
    "#include <common>",
    "#include <common>\n varying vec3 vWNormal; varying vec2 vUvL;"
  ).replace(
    "#include <begin_vertex>",
    "#include <begin_vertex>\n vWNormal = normalize(mat3(modelMatrix) * normal); vUvL = uv;"
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <common>",
    "#include <common>\n uniform sampler2D uLights; uniform vec3 uSunDir; varying vec3 vWNormal; varying vec2 vUvL;"
  ).replace(
    "#include <dithering_fragment>",
    `#include <dithering_fragment>
     float d = dot(normalize(vWNormal), normalize(uSunDir));
     float night = smoothstep(0.05, -0.25, d);
     vec3 city = texture2D(uLights, vUvL).rgb;
     gl_FragColor.rgb += city * night * 2.2;`
  );
};

const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 128), earthMat);
scene.add(earth);

// ---- 云层 ----
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.008, 96, 96),
  new THREE.MeshStandardMaterial({
    map: cloudsMap, alphaMap: cloudsMap, transparent: true,
    opacity: 0.9, depthWrite: false, metalness: 0, roughness: 1,
  })
);
scene.add(clouds);

// ---- 大气辉光（Fresnel 背面球）----
const atmoMat = new THREE.ShaderMaterial({
  transparent: true, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color(0x4a9eff) }, uSunDir: { value: sunDir } },
  vertexShader: `
    varying vec3 vN; varying vec3 vWN;
    void main(){ vN = normalize(normalMatrix * normal);
      vWN = normalize(mat3(modelMatrix)*normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vN; varying vec3 vWN; uniform vec3 uColor; uniform vec3 uSunDir;
    void main(){
      float f = pow(1.0 - abs(vN.z), 2.4);
      float lit = clamp(dot(normalize(vWN), normalize(uSunDir))*0.5+0.6, 0.15, 1.0);
      gl_FragColor = vec4(uColor * f * lit, f); }`
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(R * 1.16, 64, 64), atmoMat);
scene.add(atmosphere);

// ---- 星空背景 ----
(() => {
  const N = 4000, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const r = 90 + Math.random()*60;
    const th = Math.acos(2*Math.random()-1), ph = Math.random()*Math.PI*2;
    pos[i*3]   = r*Math.sin(th)*Math.cos(ph);
    pos[i*3+1] = r*Math.cos(th);
    pos[i*3+2] = r*Math.sin(th)*Math.sin(ph);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.35, sizeAttenuation:true })));
})();

// ================= 卫星与轨道系统 =================
const EARTH_RATE = 0.06;          // 地球自转角速度(rad/s)
const K = 1.137;                  // 开普勒速率常数：rate = K / a^1.5
const deg = THREE.MathUtils.degToRad;

// 开普勒方程求解：由平近点角 M 得偏近点角 E，再得真近点角 ν
function solveKepler(M, e){
  let E = M;
  for (let i=0;i<6;i++) E = E - (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
  return E;
}
function trueAnomaly(E, e){
  return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
}

// 小卫星模型：本体 + 两片太阳能帆板
function makeSat(color, size){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(size, size, size*1.4),
    new THREE.MeshStandardMaterial({ color:0xdedede, emissive:color, emissiveIntensity:0.7, metalness:0.6, roughness:0.4 })
  );
  g.add(body);
  const panelMat = new THREE.MeshStandardMaterial({ color:0x1b3f8b, emissive:0x0a1830, metalness:0.4, roughness:0.5, side:THREE.DoubleSide });
  const p1 = new THREE.Mesh(new THREE.PlaneGeometry(size*3.2, size*1.1), panelMat); p1.position.x =  size*2.4;
  const p2 = p1.clone(); p2.position.x = -size*2.4;
  g.add(p1, p2);
  return g;
}

const orbits = [];
// a=半长轴, e=离心率, incl=倾角, raan=升交点赤经, argp=近地点幅角, phase=初相位, geoSync=是否与地球自转同步
function buildOrbit(o){
  const a=o.a, e=o.e||0;
  // 轨道线（焦点在原点的椭圆）
  const pts=[];
  for(let i=0;i<=360;i++){
    const th = deg(i);
    const r = a*(1-e*e)/(1+e*Math.cos(th));
    pts.push(new THREE.Vector3(r*Math.cos(th), 0, r*Math.sin(th)));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:o.color, transparent:true, opacity:o.dim?0.28:0.5 })
  );
  const sat = o.moon
    ? new THREE.Mesh(new THREE.SphereGeometry(0.27, 48, 48),
        new THREE.MeshStandardMaterial({ map:moonMap, metalness:0, roughness:1 }))
    : makeSat(o.satColor||o.color, o.size||0.03);

  const group = new THREE.Group();
  group.add(line, sat);
  // 轨道定向：先 argp 绕法线(y)，再 incl 绕交点线(x)，最后 raan 绕全局竖轴(y)
  group.quaternion.setFromEuler(new THREE.Euler(0, deg(o.raan||0), 0))
    .multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(deg(o.incl||0), 0, 0)))
    .multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, deg(o.argp||0), 0)));
  scene.add(group);

  const rate = o.geoSync ? EARTH_RATE : K / Math.pow(a, 1.5);
  orbits.push({ sat, a, e, rate, M0: deg(o.phase||0) });
}

// —— 四类卫星 + 月球 ——
buildOrbit({ a:1.30, e:0,    incl:28,   color:0x00e5ff, phase:0,   size:0.028 });                 // 近地卫星 LEO
buildOrbit({ a:1.55, e:0,    incl:90,   color:0x8aff5a, phase:120, size:0.028 });                 // 极地卫星
buildOrbit({ a:6.60, e:0,    incl:0,    color:0xffa53a, phase:40,  size:0.05, geoSync:true });    // 同步卫星 GEO
buildOrbit({ a:4.20, e:0.62, incl:63.4, argp:270, color:0xff5ce0, phase:0, size:0.045 });         // 大椭圆(闪电型)
buildOrbit({ a:12.0, e:0.045,incl:5.1,  color:0xcfcfcf, phase:200, moon:true, dim:true });        // 月球

// ================= 全球热门旅游城市标注点 =================
const CITIES = [
  { name:"巴黎",     lat:48.85, lon:2.35   },
  { name:"伦敦",     lat:51.51, lon:-0.13  },
  { name:"罗马",     lat:41.90, lon:12.50  },
  { name:"巴塞罗那", lat:41.39, lon:2.17   },
  { name:"伊斯坦布尔",lat:41.01, lon:28.98 },
  { name:"迪拜",     lat:25.20, lon:55.27  },
  { name:"纽约",     lat:40.71, lon:-74.01 },
  { name:"东京",     lat:35.68, lon:139.69 },
  { name:"北京",     lat:39.90, lon:116.40 },
  { name:"曼谷",     lat:13.76, lon:100.50 },
  { name:"新加坡",   lat:1.35,  lon:103.82 },
  { name:"悉尼",     lat:-33.87,lon:151.21 },
  { name:"台北",     lat:25.03, lon:121.57 },
  { name:"首尔",     lat:37.57, lon:126.98 },
  { name:"洛杉矶",   lat:34.05, lon:-118.24 },
  { name:"圣保罗",   lat:-23.55,lon:-46.63 },
  { name:"布宜诺斯艾利斯", lat:-34.60, lon:-58.38 },
  { name:"多伦多",   lat:43.65, lon:-79.38 },
  { name:"温哥华",   lat:49.28, lon:-123.12 },
  { name:"夏威夷",   lat:21.31, lon:-157.86 },
  { name:"新德里",   lat:28.61, lon:77.21  },
  { name:"马德里",   lat:40.42, lon:-3.70  },
  { name:"莫斯科",   lat:55.76, lon:37.62  },
  { name:"圣彼得堡", lat:59.93, lon:30.34  },
  { name:"开罗",     lat:30.04, lon:31.24  },
  { name:"墨尔本",   lat:-37.81,lon:144.96 },
  { name:"上海",     lat:31.23, lon:121.47 },
  { name:"大阪",     lat:34.69, lon:135.50 },
  { name:"吉隆坡",   lat:3.14,  lon:101.69 },
  { name:"班加罗尔", lat:12.97, lon:77.59  },
  { name:"孟买",     lat:19.08, lon:72.88  },
  { name:"里约热内卢", lat:-22.91, lon:-43.17 },
  { name:"约翰内斯堡", lat:-26.20, lon:28.05 },
  { name:"亚的斯亚贝巴", lat:9.03, lon:38.74 },
  { name:"卡萨布兰卡", lat:33.57, lon:-7.59 },
  { name:"内罗毕",   lat:-1.29, lon:36.82  },
  { name:"惠灵顿",   lat:-41.29,lon:174.78 },
  { name:"奥克兰",   lat:-36.85,lon:174.76 },
  { name:"利马",     lat:-12.05,lon:-77.04 },
  { name:"波哥大",   lat:4.71,  lon:-74.07 },
  { name:"圣地亚哥", lat:-33.45,lon:-70.67 },
  { name:"柏林",     lat:52.52, lon:13.40  },
  { name:"慕尼黑",   lat:48.14, lon:11.58  },
  { name:"威尼斯",   lat:45.44, lon:12.32  },
  { name:"布拉格",   lat:50.08, lon:14.44  },
  { name:"佛罗伦萨", lat:43.77, lon:11.26  },
  { name:"雅典",     lat:37.98, lon:23.73  },
  { name:"维也纳",   lat:48.21, lon:16.37  },
  { name:"哥本哈根", lat:55.68, lon:12.57  },
  { name:"阿姆斯特丹",lat:52.37, lon:4.90   },
];

// 经纬度 → 球面三维坐标（匹配等距圆柱投影地图贴图）
function latLonToVec3(lat, lon, r){
  const phi = deg(90 - lat);
  const theta = deg(lon + 180);
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

const markersGroup = new THREE.Group();
earth.add(markersGroup);   // 作为地球子对象，随地球自转/倾斜
const cityMarkers = [];

CITIES.forEach(c => {
  const pos = latLonToVec3(c.lat, c.lon, 1.0);
  const outward = pos.clone().normalize();

  // 发光圆点
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 16, 16),
    new THREE.MeshBasicMaterial({ color:0xffd48a })
  );
  dot.position.copy(outward.clone().multiplyScalar(1.004));
  markersGroup.add(dot);

  // 脉冲光环（贴在球面，法线朝外）
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.018, 0.026, 32),
    new THREE.MeshBasicMaterial({ color:0xe8853a, transparent:true, opacity:0.9, side:THREE.DoubleSide, depthWrite:false })
  );
  ring.position.copy(outward.clone().multiplyScalar(1.004));
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), outward);
  markersGroup.add(ring);

  // 引脚小立柱
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0015, 0.0015, 0.05, 6),
    new THREE.MeshBasicMaterial({ color:0xffd48a })
  );
  stem.position.copy(outward.clone().multiplyScalar(1.025));
  stem.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), outward);
  markersGroup.add(stem);

  // HTML 城市名标签
  const el = document.createElement("div");
  el.className = "city-label";
  el.textContent = c.name;
  const label = new THREE.CSS2DObject(el);
  label.position.copy(outward.clone().multiplyScalar(1.06));
  markersGroup.add(label);

  cityMarkers.push({ dot, ring, stem, el, outward });
});

// 地球略微倾斜 23.5°
earth.rotation.z = clouds.rotation.z = THREE.MathUtils.degToRad(23.5);

loadMgr.onLoad = revealGlobe;   // 全部就绪时兜底
loadMgr.onError = (url) => {
  document.getElementById("loading").textContent = "贴图加载失败，请检查网络连接：" + url;
};

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

// 城市标注：脉冲动画 + 背面自动隐藏 + 缩小时隐藏名称
// 相机距离 > 该值时视为“看到完整地球”，此时隐藏所有城市名（放大靠近后才显示）
const LABEL_SHOW_DIST = 2.5;
const _wp = new THREE.Vector3(), _toCam = new THREE.Vector3();
function updateCityMarkers(){
  const pulse = 1 + 0.35 * Math.sin(elapsed * 3);
  const showLabels = camera.position.distanceTo(controls.target) < LABEL_SHOW_DIST;  // 已放大才显示名称
  for (const m of cityMarkers){
    m.ring.scale.setScalar(pulse);
    m.ring.material.opacity = 0.9 - 0.5 * (pulse - 0.65);

    m.dot.getWorldPosition(_wp);                 // 世界坐标（地球在原点）
    const normal = _wp.clone().normalize();      // 该点朝外法线
    _toCam.copy(camera.position).sub(_wp);        // 指向相机
    const facing = normal.dot(_toCam.normalize()); // >0 为正面
    const vis = showLabels && facing > 0.12;      // 需已放大且在正面
    m.el.style.opacity = vis ? 1 : 0;
    m.dot.visible = m.ring.visible = m.stem.visible = facing > -0.1;
  }
}

const clock = new THREE.Clock();
let elapsed = 0;
(function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;
  earth.rotation.y  += dt * EARTH_RATE;
  clouds.rotation.y += dt * 0.08;   // 云层稍快

  // 更新卫星/月球位置（开普勒运动，近地点快、远地点慢）
  for (const ob of orbits){
    const M = ob.M0 + ob.rate * elapsed;
    const E = solveKepler(M, ob.e);
    const nu = trueAnomaly(E, ob.e);
    const r  = ob.a * (1 - ob.e * Math.cos(E));
    ob.sat.position.set(r*Math.cos(nu), 0, r*Math.sin(nu));
  }

  updateCityMarkers();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();
</script>
</body>
</html>
